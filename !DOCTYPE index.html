<style>
:root{--primary:#0b3b78;--accent:#1683ff;--light:#f4f7fb;--text:#16243a}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--light);color:var(--text)}
header{background:linear-gradient(100deg,#06254d,#0b4b91);color:white;padding:16px 5%;display:flex;align-items:center;gap:28px;position:sticky;top:0;z-index:5}
.logo{font-size:25px;font-weight:800;white-space:nowrap}.logo span{background:white;color:var(--primary);padding:6px 9px;border-radius:10px;margin-right:8px}
nav{display:flex;gap:20px;flex:1}nav a{color:#fff;text-decoration:none;cursor:pointer}
.search{border:0;border-radius:22px;padding:11px 16px;width:220px}
.hero{margin:28px auto;max-width:1200px;padding:48px;border-radius:20px;color:white;background:linear-gradient(120deg,#071d40,#1764bd);display:flex;justify-content:space-between;align-items:center}
.hero h1{font-size:42px;margin:0 0 12px}.hero p{font-size:18px}.hero button,.buy{background:#1683ff;color:white;border:0;padding:13px 22px;border-radius:8px;font-weight:bold;cursor:pointer}
.hero-art{font-size:100px}
main{max-width:1200px;margin:auto;padding:0 18px 40px}.section-title{font-size:28px;border-left:5px solid var(--accent);padding-left:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:18px}
.card{background:white;border-radius:12px;padding:15px;box-shadow:0 3px 12px #102c4a12;cursor:pointer;transition:.2s}
.card:hover{transform:translateY(-4px);box-shadow:0 8px 20px #102c4a22}
.photo-wrap{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#fff;overflow:hidden;border-radius:8px}
.product-photo{max-width:100%;max-height:100%;object-fit:contain;display:block;transition:transform .35s ease}
.card:hover .product-photo{transform:scale(1.05)}
.product-img{height:205px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#fff;border-radius:10px;margin-bottom:12px;border:1px solid #e8eef5;padding:10px}
.card h3{font-size:16px;margin:8px 0}.type{color:#70819a;font-size:13px}.price{color:#0756ba;font-size:18px;font-weight:bold;margin-top:12px}
footer{background:#06254d;color:white;padding:25px 5%;text-align:center}
.detail{background:white;border-radius:15px;padding:28px;display:grid;grid-template-columns:1fr 1fr;gap:35px;margin-top:25px}
.detail .product-img{height:460px;padding:20px}.detail h1{font-size:32px}.specs{margin-top:25px;background:#f6f8fb;padding:18px;border-radius:10px}.specs p{margin:9px 0}.back{border:0;background:none;color:#0756ba;cursor:pointer;font-size:16px;margin-top:20px}
.tech-spec-section{margin-top:15px;padding-top:12px;border-top:1px dashed #d1dbe8}
.tech-spec-title{font-weight:bold;color:var(--primary);margin-bottom:6px;display:inline-block}

/* GIAO DIỆN KHU VỰC TRÒ CHƠI (GAME HUB) */
.game-hub{background:white;border-radius:15px;padding:30px;margin-top:25px;box-shadow:0 4px 15px #102c4a12;text-align:center}
.game-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;margin-top:25px}
.game-card{background:linear-gradient(135deg, #0b3b78, #1764bd);color:white;border-radius:16px;padding:20px;cursor:pointer;transition:all 0.3s ease;box-shadow:0 6px 15px rgba(11,59,120,0.2)}
.game-card:hover{transform:translateY(-8px);box-shadow:0 12px 25px rgba(11,59,120,0.35)}
.game-icon{font-size:50px;margin-bottom:8px}
.game-card h3{margin:8px 0 5px 0;font-size:20px}
.game-card p{font-size:13px;opacity:0.9;margin:0}

/* KHU VỰC CHƠI GAME */
.game-container{background:white;border-radius:15px;padding:25px;margin-top:25px;text-align:center;box-shadow:0 4px 15px #102c4a12}
.game-header{display:flex;justify-content:space-between;align-items:center;max-width:360px;margin:0 auto 15px auto;font-weight:bold;font-size:18px}
.game-canvas{background:#000;border-radius:10px;box-shadow:0 4px 10px rgba(0,0,0,0.2);display:block;margin:0 auto;cursor:pointer}
.game-controls{margin-top:15px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.game-btn{background:var(--accent);color:white;border:none;padding:10px 20px;border-radius:6px;font-weight:bold;cursor:pointer;transition:0.2s}
.game-btn:hover{background:var(--primary)}
.d-pad{display:grid;grid-template-columns:repeat(3,50px);gap:5px;justify-content:center;margin-top:15px}
.d-pad button{width:50px;height:50px;background:#e8eef5;border:none;border-radius:8px;font-size:18px;font-weight:bold;cursor:pointer;color:var(--primary)}
.d-pad button:active{background:var(--accent);color:white}

/* PHONG CÁCH CHO BASKETBROS */
#basketbros-container { margin: 0 auto; max-width: 800px; border-radius: 8px; overflow: hidden; border: 2px solid #0b3b78; }
.basket-guide { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px; text-align: left; background: #f4f7fb; padding: 15px; border-radius: 8px; }
.basket-guide h4 { margin: 0 0 8px 0; color: var(--primary); }

/* STYLES QUẢNG CÁO GÓC MÀN HÌNH (FLOATING AD) */
.sticky-ad {
  position: fixed;
  bottom: 20px;
  right: 20px;
  width: 260px;
  background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
  color: #fff;
  border-radius: 12px;
  box-shadow: 0 8px 25px rgba(0,0,0,0.4);
  border: 2px solid #f39c12;
  z-index: 9999;
  overflow: hidden;
  transition: all 0.3s ease;
  font-family: Arial, sans-serif;
}
.sticky-ad-header {
  background: #f39c12;
  color: #000;
  padding: 6px 12px;
  font-size: 11px;
  font-weight: bold;
  display: flex;
  justify-content: space-between;
  align-items: center;
  text-transform: uppercase;
}
.sticky-ad-close {
  background: none;
  border: none;
  color: #000;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  padding: 0;
  line-height: 1;
}
.sticky-ad-body {
  padding: 12px;
  text-align: center;
}
.sticky-ad-badge {
  display: inline-block;
  background: #e74c3c;
  color: #fff;
  font-size: 11px;
  font-weight: bold;
  padding: 3px 8px;
  border-radius: 20px;
  margin-bottom: 8px;
  animation: pulse 1.5s infinite;
}
.sticky-ad-title {
  font-size: 16px;
  font-weight: bold;
  margin: 0 0 4px 0;
  color: #f1c40f;
}
.sticky-ad-subtitle {
  font-size: 12px;
  color: #ddd;
  margin-bottom: 10px;
}
.sticky-ad-price {
  font-size: 18px;
  font-weight: bold;
  color: #2ecc71;
  margin-bottom: 10px;
}
.sticky-ad-price span {
  font-size: 12px;
  color: #95a5a6;
  text-decoration: line-through;
  margin-left: 5px;
}
.sticky-ad-btn {
  display: block;
  width: 100%;
  background: #f39c12;
  color: #000;
  text-align: center;
  padding: 8px 0;
  border-radius: 6px;
  font-weight: bold;
  text-decoration: none;
  font-size: 13px;
  transition: 0.2s;
}
.sticky-ad-btn:hover {
  background: #f1c40f;
}

@keyframes pulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.05); }
  100% { transform: scale(1); }
}

@media(max-width:750px){
  header{flex-wrap:wrap;gap:12px}
  nav{order:3;width:100%;justify-content:space-between}
  .hero{padding:28px}.hero h1{font-size:30px}
  .hero-art{font-size:55px}
  .detail{grid-template-columns:1fr}
  .search{width:160px}
  .basket-guide{grid-template-columns:1fr;}
  .sticky-ad { width: 200px; bottom: 10px; right: 10px; }
}
</style>

function startBasketGame(mode) {
  basketGameMode = mode;
  if (phaserGameInstance) {
    phaserGameInstance.destroy(true);
  }
  const config = {
    type: Phaser.AUTO,
    width: 800,
    height: 450,
    parent: 'basketbros-container',
    physics: {

    },
    scene: [BasketScene]
  };

}

class BasketScene extends Phaser.Scene {
  constructor() {
    super('BasketScene');
  }

  create() {
    this.score1 = 0;
    this.score2 = 0;

    this.add.rectangle(400, 225, 800, 450, 0x87CEEB);
    const ground = this.add.rectangle(400, 430, 800, 40, 0xC68B59);
    this.physics.add.existing(ground, true);

    this.createHoop(50, 250, true);
    this.createHoop(750, 250, false);

    this.p1 = this.add.rectangle(200, 350, 30, 60, 0x0000FF);
    this.physics.add.existing(this.p1);
    this.p1.body.setCollideWorldBounds(true);

    this.p2 = this.add.rectangle(600, 350, 30, 60, 0xFF0000);
    this.physics.add.existing(this.p2);
    this.p2.body.setCollideWorldBounds(true);

    this.ball = this.add.circle(400, 200, 12, 0xFF6600);
    this.physics.add.existing(this.ball);
    this.ball.body.setCollideWorldBounds(true);
    this.ball.body.setBounce(0.6);

    this.holder = null;

    this.physics.add.collider(this.p1, ground);
    this.physics.add.collider(this.p2, ground);
    this.physics.add.collider(this.ball, ground);

    this.scoreText = this.add.text(330, 20, 'P1: 0 - 0 P2', { fontSize: '28px', fill: '#000', fontWeight: 'bold' });

    this.keys = this.input.keyboard.addKeys({
      p1Left: 'A', p1Right: 'D', p1Jump: 'W', p1Action: 'SPACE',
      p2Left: 'LEFT', p2Right: 'RIGHT', p2Jump: 'UP', p2Action: 'ENTER'
    });
  }

  createHoop(x, y, isLeft) {
    const pole = this.add.rectangle(isLeft ? x - 20 : x + 20, y + 60, 10, 150, 0x555555);
    this.physics.add.existing(pole, true);
    
    const rim = this.add.rectangle(x, y, 40, 8, 0xFF0000);
    this.physics.add.existing(rim, true);

    const sensor = this.add.rectangle(x, y + 10, 30, 5, 0x00FF00);
    sensor.setVisible(false);
    this.physics.add.existing(sensor, true);

    this.physics.add.overlap(this.ball, sensor, () => {
      if (this.ball.body.velocity.y > 0) {
        if (isLeft) this.score2++;
        else this.score1++;
        this.resetBall();
      }
    });
  }

  resetBall() {
    this.scoreText.setText(`P1: ${this.score1} - ${this.score2} P2`);
    this.holder = null;
    this.ball.body.allowGravity = true;
    this.ball.setPosition(400, 150);
    this.ball.body.setVelocity(0, 0);
  }

  update() {
    if (this.keys.p1Left.isDown) this.p1.body.setVelocityX(-160);
    else if (this.keys.p1Right.isDown) this.p1.body.setVelocityX(160);
    else this.p1.body.setVelocityX(0);

    if (this.keys.p1Jump.isDown && this.p1.body.touching.down) {
      this.p1.body.setVelocityY(-400);
    }

    if (Phaser.Input.Keyboard.JustDown(this.keys.p1Action)) {
      this.handleAction(this.p1, 1);
    }

    if (basketGameMode === '2P') {
      if (this.keys.p2Left.isDown) this.p2.body.setVelocityX(-160);
      else if (this.keys.p2Right.isDown) this.p2.body.setVelocityX(160);
      else this.p2.body.setVelocityX(0);

      if (this.keys.p2Jump.isDown && this.p2.body.touching.down) {
        this.p2.body.setVelocityY(-400);
      }

      if (Phaser.Input.Keyboard.JustDown(this.keys.p2Action)) {
        this.handleAction(this.p2, 2);
      }
    } else {
      if (this.holder === this.p2) {
        this.p2.body.setVelocityX(-120);
        if (this.p2.x < 300 && Math.random() < 0.03) {
          this.shoot(this.p2, -300, -500);
        }
      } else {
        if (this.ball.x < this.p2.x) this.p2.body.setVelocityX(-120);
        else this.p2.body.setVelocityX(120);

        if (Phaser.Math.Distance.BetweenPoints(this.p2, this.ball) < 40) {
          this.holder = this.p2;
        }
      }
    }

    if (this.holder) {
      this.ball.setPosition(this.holder.x, this.holder.y - 20);
      this.ball.body.setVelocity(0, 0);
      this.ball.body.allowGravity = false;
    } else {
      this.ball.body.allowGravity = true;
    }
  }

  handleAction(player, playerNum) {
    if (this.holder === player) {
      const dir = playerNum === 1 ? 1 : -1;
      this.shoot(player, 350 * dir, -450);
    } else {
      const dist = Phaser.Math.Distance.BetweenPoints(player, this.ball);
      if (dist < 50) {
        this.holder = player;
      }
    }
  }

  shoot(player, vx, vy) {
    this.holder = null;
    this.ball.body.allowGravity = true;
    this.ball.body.setVelocity(vx, vy);
  }
}

let snakeCanvas, snakeCtx;
let snake = [], snakeFood = {};
let snakeDx = 20, snakeDy = 0;
let snakeScore = 0;
let snakeHighScore = localStorage.getItem('snakeHighScore') || 0;
let isSnakePaused = false;
const gridSize = 20;

function showSnakeGame(){
  stopCurrentGame();
  let html = `
    <button class="back" onclick="showGameMenu()">← Chọn trò chơi khác</button>

      </div>

      <canvas id="snakeCanvas" class="game-canvas" width="360" height="360"></canvas>

      <div class="game-controls">
        <button class="game-btn" onclick="initSnakeGame()">Chơi mới / Bắt đầu</button>
        <button class="game-btn" style="background:#70819a" onclick="toggleSnakePause()">Tạm dừng</button>
      </div>

      <div class="d-pad">
        <div></div>
        <button onclick="changeSnakeDir('UP')">▲</button>
        <div></div>

        <button onclick="changeSnakeDir('DOWN')">▼</button>
        <button onclick="changeSnakeDir('RIGHT')">▶</button>
      </div>
    </div>
  `;
  document.getElementById("app").innerHTML = html;
  snakeCanvas = document.getElementById("snakeCanvas");
  snakeCtx = snakeCanvas.getContext("2d");
  
  snakeCtx.fillStyle = "#071d40";
  snakeCtx.fillRect(0, 0, snakeCanvas.width, snakeCanvas.height);
  snakeCtx.fillStyle = "#ffffff";
  snakeCtx.font = "16px Arial";
  snakeCtx.textAlign = "center";
  snakeCtx.fillText("Nhấn 'Chơi mới' để bắt đầu", snakeCanvas.width / 2, snakeCanvas.height / 2);
}

function initSnakeGame(){
  stopCurrentGame();
  snake = [{x: 160, y: 160}, {x: 140, y: 160}, {x: 120, y: 160}];
  snakeDx = gridSize;
  snakeDy = 0;
  snakeScore = 0;
  isSnakePaused = false;
  document.getElementById("snakeScore").innerText = snakeScore;
  spawnSnakeFood();
  currentGameLoop = setInterval(snakeStep, 130);
}

function toggleSnakePause(){
  if (!currentGameLoop && !isSnakePaused) return;
  if (isSnakePaused) {
    currentGameLoop = setInterval(snakeStep, 130);
    isSnakePaused = false;
  } else {
    stopCurrentGame();
    isSnakePaused = true;
    snakeCtx.fillStyle = "rgba(0, 0, 0, 0.5)";
    snakeCtx.fillRect(0, 0, snakeCanvas.width, snakeCanvas.height);
    snakeCtx.fillStyle = "#fff";
    snakeCtx.font = "20px Arial";
    snakeCtx.textAlign = "center";
    snakeCtx.fillText("ĐÃ TẠM DỪNG", snakeCanvas.width / 2, snakeCanvas.height / 2);
  }
}

function spawnSnakeFood(){
  snakeFood = {
    x: Math.floor(Math.random() * (snakeCanvas.width / gridSize)) * gridSize,
    y: Math.floor(Math.random() * (snakeCanvas.height / gridSize)) * gridSize
  };
  snake.forEach(part => {
    if (part.x === snakeFood.x && part.y === snakeFood.y) spawnSnakeFood();
  });
}

function snakeStep(){
  const head = {x: snake[0].x + snakeDx, y: snake[0].y + snakeDy};

  if (head.x < 0 || head.x >= snakeCanvas.width || head.y < 0 || head.y >= snakeCanvas.height || checkSnakeCollision(head)) {
    stopCurrentGame();
    snakeCtx.fillStyle = "rgba(200, 0, 0, 0.75)";
    snakeCtx.fillRect(0, 0, snakeCanvas.width, snakeCanvas.height);
    snakeCtx.fillStyle = "#fff";
    snakeCtx.font = "22px Arial";
    snakeCtx.textAlign = "center";
    snakeCtx.fillText("GAME OVER!", snakeCanvas.width / 2, snakeCanvas.height / 2 - 10);
    snakeCtx.font = "14px Arial";
    snakeCtx.fillText("Điểm của bạn: " + snakeScore, snakeCanvas.width / 2, snakeCanvas.height / 2 + 20);
    return;
  }

  snake.unshift(head);

  if (head.x === snakeFood.x && head.y === snakeFood.y) {
    snakeScore += 10;
    document.getElementById("snakeScore").innerText = snakeScore;
    if (snakeScore > snakeHighScore) {
      snakeHighScore = snakeScore;
      localStorage.setItem('snakeHighScore', snakeHighScore);
      document.getElementById("snakeHighScore").innerText = snakeHighScore;
    }
    spawnSnakeFood();
  } else {
    snake.pop();
  }

  drawSnakeGame();
}

function checkSnakeCollision(head){
  return snake.some((part, index) => index !== 0 && part.x === head.x && part.y === head.y);
}

function drawSnakeGame(){
  snakeCtx.fillStyle = "#071d40";
  snakeCtx.fillRect(0, 0, snakeCanvas.width, snakeCanvas.height);

  snakeCtx.fillStyle = "#ff4757";
  snakeCtx.beginPath();
  snakeCtx.arc(snakeFood.x + gridSize/2, snakeFood.y + gridSize/2, gridSize/2 - 2, 0, Math.PI * 2);
  snakeCtx.fill();

  snake.forEach((part, i) => {
    snakeCtx.fillStyle = i === 0 ? "#1683ff" : "#2ed573";
    snakeCtx.fillRect(part.x + 1, part.y + 1, gridSize - 2, gridSize - 2);
  });
}

function changeSnakeDir(dir){
  if (dir === 'UP' && snakeDy === 0) { snakeDx = 0; snakeDy = -gridSize; }
  if (dir === 'DOWN' && snakeDy === 0) { snakeDx = 0; snakeDy = gridSize; }
  if (dir === 'LEFT' && snakeDx === 0) { snakeDx = -gridSize; snakeDy = 0; }
  if (dir === 'RIGHT' && snakeDx === 0) { snakeDx = gridSize; snakeDy = 0; }
}

function initFlappyBird(){
  stopCurrentGame();
  birdY = 180;
  birdVelocity = 0;
  pipes = [];
  birdScore = 0;
  pipeSpawnTimer = 0;
  isBirdRunning = true;
  document.getElementById("birdScore").innerText = birdScore;
  
  function loop(){
    if (!isBirdRunning) return;
    updateFlappyBird();
    drawFlappyBird();
    currentGameLoop = requestAnimationFrame(loop);
  }
  loop();
}

function flapBird(){
  if (!isBirdRunning) {
    initFlappyBird();
    return;
  }
  birdVelocity = jumpStrength;
}

function updateFlappyBird(){
  birdVelocity += gravity;
  birdY += birdVelocity;

  if (birdY < 12) birdY = 12;
  if (birdY + 12 >= birdCanvas.height - 40) {
    endFlappyBird();
    return;
  }

  pipeSpawnTimer++;
  if (pipeSpawnTimer % 90 === 0) {
    const gap = 115;
    const minTop = 40;
    const maxTop = birdCanvas.height - 40 - gap - minTop;
    const topHeight = Math.floor(Math.random() * (maxTop - minTop + 1)) + minTop;
    pipes.push({
      x: birdCanvas.width,
      top: topHeight,
      bottom: birdCanvas.height - 40 - topHeight - gap,
      passed: false
    });
  }

  pipes.forEach(pipe => {
    pipe.x -= 2;

    if (!pipe.passed && pipe.x < 50) {
      pipe.passed = true;
      birdScore++;
      document.getElementById("birdScore").innerText = birdScore;
      if (birdScore > birdHighScore) {
        birdHighScore = birdScore;
        localStorage.setItem('birdHighScore', birdHighScore);
        document.getElementById("birdHighScore").innerText = birdHighScore;
      }
    }

    if (
      50 + 12 > pipe.x && 50 - 12 < pipe.x + 45 &&
      (birdY - 12 < pipe.top || birdY + 12 > birdCanvas.height - 40 - pipe.bottom)
    ) {
      endFlappyBird();
    }
  });

  if (pipes.length > 0 && pipes[0].x < -50) {
    pipes.shift();
  }
}

function drawFlappyBird(){
  birdCtx.fillStyle = "#70c5ce";
  birdCtx.fillRect(0, 0, birdCanvas.width, birdCanvas.height);

  pipes.forEach(pipe => {
    birdCtx.fillStyle = "#2ed573";
    birdCtx.fillRect(pipe.x, 0, 45, pipe.top);
    birdCtx.strokeStyle = "#1e8449";
    birdCtx.strokeRect(pipe.x, 0, 45, pipe.top);

    birdCtx.fillRect(pipe.x, birdCanvas.height - 40 - pipe.bottom, 45, pipe.bottom);
    birdCtx.strokeRect(pipe.x, birdCanvas.height - 40 - pipe.bottom, 45, pipe.bottom);
  });

  birdCtx.fillStyle = "#ddd896";
  birdCtx.fillRect(0, birdCanvas.height - 40, birdCanvas.width, 40);
  birdCtx.fillStyle = "#ded895";
  birdCtx.fillRect(0, birdCanvas.height - 40, birdCanvas.width, 8);

  birdCtx.fillStyle = "#f1c40f";
  birdCtx.beginPath();
  birdCtx.arc(50, birdY, 12, 0, Math.PI * 2);
  birdCtx.fill();
  birdCtx.fillStyle = "#e67e22";
  birdCtx.fillRect(56, birdY - 3, 8, 6);
  birdCtx.fillStyle = "#000";
  birdCtx.beginPath();
  birdCtx.arc(53, birdY - 4, 2, 0, Math.PI * 2);
  birdCtx.fill();
}

function endFlappyBird(){
  isBirdRunning = false;
  stopCurrentGame();
  
  birdCtx.fillStyle = "rgba(200, 0, 0, 0.75)";
  birdCtx.fillRect(0, 0, birdCanvas.width, birdCanvas.height);
  birdCtx.fillStyle = "#fff";
  birdCtx.font = "22px Arial";
  birdCtx.textAlign = "center";
  birdCtx.fillText("GAME OVER!", birdCanvas.width / 2, birdCanvas.height / 2 - 10);
  birdCtx.font = "14px Arial";
  birdCtx.fillText("Điểm của bạn: " + birdScore, birdCanvas.width / 2, birdCanvas.height / 2 + 20);
}

function initPacmanGame(){
  stopCurrentGame();
  pacScore = 0;
  document.getElementById("pacScore").innerText = pacScore;
  pacMap = JSON.parse(JSON.stringify(mapOriginal));
  pacman = { x: 1, y: 1, dirX: 1, dirY: 0, nextDirX: 1, nextDirY: 0 };
  ghosts = [
    { x: 8, y: 5, color: '#ff0000' },
    { x: 9, y: 5, color: '#ffb8ff' },
    { x: 8, y: 4, color: '#00ffff' }
  ];

  currentGameLoop = setInterval(pacmanStep, 200);
}

function changePacDir(dir){
  if (dir === 'UP') { pacman.nextDirX = 0; pacman.nextDirY = -1; }
  if (dir === 'DOWN') { pacman.nextDirX = 0; pacman.nextDirY = 1; }
  if (dir === 'LEFT') { pacman.nextDirX = -1; pacman.nextDirY = 0; }
  if (dir === 'RIGHT') { pacman.nextDirX = 1; pacman.nextDirY = 0; }
}

function pacmanStep(){
  if (pacMap[pacman.y + pacman.nextDirY] && pacMap[pacman.y + pacman.nextDirY][pacman.x + pacman.nextDirX] !== 1) {
    pacman.dirX = pacman.nextDirX;
    pacman.dirY = pacman.nextDirY;
  }

  if (pacMap[pacman.y + pacman.dirY] && pacMap[pacman.y + pacman.dirY][pacman.x + pacman.dirX] !== 1) {
    pacman.x += pacman.dirX;
    pacman.y += pacman.dirY;
  }

  if (pacMap[pacman.y][pacman.x] === 0) {
    pacMap[pacman.y][pacman.x] = 2;
    pacScore += 10;
    document.getElementById("pacScore").innerText = pacScore;
    if (pacScore > pacHighScore) {
      pacHighScore = pacScore;
      localStorage.setItem('pacHighScore', pacHighScore);
      document.getElementById("pacHighScore").innerText = pacHighScore;
    }
  }

  ghosts.forEach(g => {
    let possibleDirs = [
      {x: 0, y: -1}, {x: 0, y: 1}, {x: -1, y: 0}, {x: 1, y: 0}
    ].filter(d => pacMap[g.y + d.y] && pacMap[g.y + d.y][g.x + d.x] !== 1);

    if (possibleDirs.length > 0) {
      let chosen = possibleDirs[Math.floor(Math.random() * possibleDirs.length)];
      g.x += chosen.x;
      g.y += chosen.y;
    }

    if (g.x === pacman.x && g.y === pacman.y) {
      endPacmanGame();
    }
  });

  drawPacmanGame();
}

function drawPacmanGame(){
  pacCtx.fillStyle = "#000";
  pacCtx.fillRect(0, 0, pacCanvas.width, pacCanvas.height);

  for (let r = 0; r < pacMap.length; r++) {
    for (let c = 0; c < pacMap[r].length; c++) {
      if (pacMap[r][c] === 1) {
        pacCtx.fillStyle = "#1919a6";
        pacCtx.fillRect(c * pacTileSize, r * pacTileSize, pacTileSize, pacTileSize);
      } else if (pacMap[r][c] === 0) {
        pacCtx.fillStyle = "#ffb8ae";
        pacCtx.beginPath();
        pacCtx.arc(c * pacTileSize + 10, r * pacTileSize + 10, 3, 0, Math.PI * 2);
        pacCtx.fill();
      }
    }
  }

  pacCtx.fillStyle = "#ffff00";
  pacCtx.beginPath();
  pacCtx.arc(pacman.x * pacTileSize + 10, pacman.y * pacTileSize + 10, 8, 0.2 * Math.PI, 1.8 * Math.PI);
  pacCtx.lineTo(pacman.x * pacTileSize + 10, pacman.y * pacTileSize + 10);
  pacCtx.fill();

  ghosts.forEach(g => {
    pacCtx.fillStyle = g.color;
    pacCtx.beginPath();
    pacCtx.arc(g.x * pacTileSize + 10, g.y * pacTileSize + 10, 8, 0, Math.PI * 2);
    pacCtx.fill();
  });
}

function endPacmanGame(){
  stopCurrentGame();
  pacCtx.fillStyle = "rgba(200, 0, 0, 0.75)";
  pacCtx.fillRect(0, 0, pacCanvas.width, pacCanvas.height);
  pacCtx.fillStyle = "#fff";
  pacCtx.font = "22px Arial";
  pacCtx.textAlign = "center";
  pacCtx.fillText("GAME OVER!", pacCanvas.width / 2, pacCanvas.height / 2 - 10);
  pacCtx.font = "14px Arial";
  pacCtx.fillText("Điểm của bạn: " + pacScore, pacCanvas.width / 2, pacCanvas.height / 2 + 20);
}

function initMarioGame(){
  stopCurrentGame();
  marioScore = 0;
  marioCameraX = 0;
  isMarioRunning = true;
  document.getElementById("marioScore").innerText = marioScore;

  mario = { x: 50, y: 150, w: 20, h: 26, vx: 0, vy: 0, isGrounded: false };
  marioKeys = { left: false, right: false, up: false };

  marioPlatforms = [
    { x: 0, y: 240, w: 320, h: 40 },

  ];

  marioCoins = [

    { x: 470, y: 140, collected: false },
    { x: 500, y: 140, collected: false },
    { x: 630, y: 100, collected: false },
    { x: 830, y: 140, collected: false },
    { x: 860, y: 140, collected: false }
  ];

  marioEnemies = [

  ];

  }

function marioMove(dir, state) {
  if (dir === 'left') marioKeys.left = state;
  if (dir === 'right') marioKeys.right = state;
}

function marioJump() {
  if (mario.isGrounded) {
    mario.vy = -9.5;
    mario.isGrounded = false;
  }
}

function updateMario(){
  if (marioKeys.left) mario.vx = -3;
  else if (marioKeys.right) mario.vx = 3;
  else mario.vx = 0;

  mario.vy += 0.45;

  mario.x += mario.vx;
  mario.y += mario.vy;

  if (mario.x < 0) mario.x = 0;

  mario.isGrounded = false;
  marioPlatforms.forEach(p => {
    if (
      mario.x + mario.w > p.x &&
      mario.x < p.x + p.w &&
      mario.y + mario.h >= p.y &&
      mario.y + mario.h <= p.y + p.h &&
      mario.vy >= 0
    ) {
      mario.y = p.y - mario.h;
      mario.vy = 0;
      mario.isGrounded = true;
    }
  });

  marioEnemies.forEach(e => {
    if (!e.alive) return;

    e.x += e.vx;
    if (e.x <= e.minX || e.x + e.w >= e.maxX) {
      e.vx *= -1;
    }

    if (
      mario.x + mario.w > e.x &&
      mario.x < e.x + e.w &&
      mario.y + mario.h > e.y &&
      mario.y < e.y + e.h
    ) {
      if (mario.vy > 0 && (mario.y + mario.h - mario.vy) <= e.y + 8) {
        e.alive = false;
        mario.vy = -6;
        marioScore += 100;
        updateScore(marioScore);
      } else {
        endMarioGame(false);
      }
    }
  });

  marioCoins.forEach(c => {
    if (!c.collected && Math.hypot((mario.x + mario.w/2) - c.x, (mario.y + mario.h/2) - c.y) < 18) {
      c.collected = true;
      marioScore += 50;
      updateScore(marioScore);
    }
  });

  if (mario.x + mario.w >= marioFlag.x) {
    marioScore += 500;
    updateScore(marioScore);
    endMarioGame(true);
    return;
  }

  if (mario.y > marioCanvas.height) {
    endMarioGame(false);
  }

  marioCameraX = mario.x - 100;
  if (marioCameraX < 0) marioCameraX = 0;
}

function updateScore(score) {
  document.getElementById("marioScore").innerText = score;
  if (score > marioHighScore) {
    marioHighScore = score;
    localStorage.setItem('marioHighScore', marioHighScore);
    document.getElementById("marioHighScore").innerText = marioHighScore;
  }
}

function drawMario(){
  marioCtx.fillStyle = "#5c94fc";
  marioCtx.fillRect(0, 0, marioCanvas.width, marioCanvas.height);

  marioCtx.save();
  marioCtx.translate(-marioCameraX, 0);

  marioPlatforms.forEach(p => {
    marioCtx.fillStyle = "#c84c0c";
    marioCtx.fillRect(p.x, p.y, p.w, p.h);
    marioCtx.fillStyle = "#00a800";
    marioCtx.fillRect(p.x, p.y, p.w, 5);
  });

  marioCoins.forEach(c => {
    if (!c.collected) {
      marioCtx.fillStyle = "#f1c40f";
      marioCtx.beginPath();
      marioCtx.arc(c.x, c.y, 7, 0, Math.PI * 2);
      marioCtx.fill();
      marioCtx.strokeStyle = "#d4ac0d";
      marioCtx.stroke();
    }
  });

  marioEnemies.forEach(e => {
    if (e.alive) {
      marioCtx.fillStyle = "#8b4513";
      marioCtx.fillRect(e.x, e.y, e.w, e.h);
      marioCtx.fillStyle = "#ffffff";
      marioCtx.fillRect(e.x + 3, e.y + 4, 4, 5);
      marioCtx.fillRect(e.x + 13, e.y + 4, 4, 5);
      marioCtx.fillStyle = "#000000";
      marioCtx.fillRect(e.x + 4, e.y + 6, 2, 3);
      marioCtx.fillRect(e.x + 14, e.y + 6, 2, 3);
    }
  });

  marioCtx.fillStyle = "#ffffff";
  marioCtx.fillRect(marioFlag.x + 8, marioFlag.y, 4, marioFlag.h);
  marioCtx.fillStyle = "#2ed573";
  marioCtx.beginPath();
  marioCtx.moveTo(marioFlag.x + 12, marioFlag.y);
  marioCtx.lineTo(marioFlag.x + 45, marioFlag.y + 15);
  marioCtx.lineTo(marioFlag.x + 12, marioFlag.y + 30);
  marioCtx.fill();
  marioCtx.fillStyle = "#f1c40f";
  marioCtx.beginPath();
  marioCtx.arc(marioFlag.x + 10, marioFlag.y, 7, 0, Math.PI * 2);
  marioCtx.fill();

  marioCtx.fillStyle = "#e74c3c";
  marioCtx.fillRect(mario.x, mario.y, mario.w, mario.h);
  marioCtx.fillStyle = "#2980b9";
  marioCtx.fillRect(mario.x, mario.y + 14, mario.w, 12);
  marioCtx.fillStyle = "#f39c12";
  marioCtx.fillRect(mario.x + 3, mario.y + 2, 14, 10);

  marioCtx.restore();
}

  }

  if (document.getElementById("pacCanvas")) {
    if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.key)) e.preventDefault();
    if (e.key === "ArrowUp" || e.key === "w" || e.key === "W") changePacDir('UP');
    if (e.key === "ArrowDown" || e.key === "s" || e.key === "S") changePacDir('DOWN');
    if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") changePacDir('LEFT');
    if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") changePacDir('RIGHT');
  }

  if (document.getElementById("marioCanvas")) {
    if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].includes(e.key)) e.preventDefault();
    if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") marioKeys.left = true;
    if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") marioKeys.right = true;
    if (e.key === "ArrowUp" || e.key === "w" || e.key === "W" || e.key === " ") marioJump();
  }
});

window.addEventListener("keyup", e => {
  if (document.getElementById("marioCanvas")) {
    if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") marioKeys.left = false;
    if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") marioKeys.right = false;
  }
});

// Mặc định chạy trang chủ khi tải trang
renderProducts();
</script>
</body>
</html>
